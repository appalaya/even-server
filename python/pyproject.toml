[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "even-sync-server"
version = "1.0.0"
description = "Python reference server for the Even sync protocol (v1): stores client-encrypted envelopes it cannot read."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[project.scripts]
even-server = "even_server.main:main"

[tool.setuptools]
packages = ["even_server"]

[tool.setuptools.package-data]
even_server = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette 1.x nudges TestClient users towards httpx2; httpx still works.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
